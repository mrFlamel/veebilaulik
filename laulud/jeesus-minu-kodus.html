<script>
	getSongIndex().then(songIndex => {
		for (let i = 0; i < songIndex.length; i++) {
			if(songIndex[i].fail == lauluNimi){
				document.title = songIndex[i].pealkiri + " - Veebilaulik"

				if (songIndex[i].orgpealkiri == ""){
					lisaLauluInfo(songIndex[i].pealkiri, "song-title");
				} else {
					lisaLauluInfo(songIndex[i].pealkiri + " <a style='font-weight:normal'>(" + songIndex[i].orgpealkiri + ")</a>", "song-title");
				}
				
				
				var kelleleViidata = "";
				if (songIndex[i].sonade_autor == ""){ //<span><b>Sõnad</b> Käbi Lindmets</span>
					kelleleViidata = kelleleViidata + "<span><b>Viis ja sõnad</b> " + songIndex[i].viisi_autor + "</span>"
				} else {
					kelleleViidata = kelleleViidata + "<span><b>Viis</b> " + songIndex[i].viisi_autor + "</span>"
					kelleleViidata = kelleleViidata + "<span><b>Sõnad</b> " + songIndex[i].sonade_autor + "</span>"
				}
				if (songIndex[i].tolke_autor){
					kelleleViidata = kelleleViidata + "<span><b>Tõlge</b> " + songIndex[i].tolke_autor + "</span>"
				}
				lisaLauluInfo(kelleleViidata, "credits")
				lisaLauluInfo(songIndex[i].id, "song-number");
				lisaLauluInfo(songIndex[i].teemad.replace(/\//g, ' · '), "song-meta");

				// MATERJALID
				lisaLauluInfo('<span class="resource-label">Materjalid</span><a target="_blank" href="/akordifailid/' + songIndex[i].fail + "-" + songIndex[i].helistik + '.pdf">Akordid <span>' + songIndex[i].helistik + '</span> <i>→</i></a>', "resource-bar")
				
				hangiSonad(lauluNimi)


				break
			}
    }
	})


	function hangiSonad(lauluNimiInner){
		fetch("/laulutekstid/" + lauluNimiInner + ".txt")
		.then(response => {
			if (!response.ok){
				document.getElementById("lauluDiv").innerText = "Laulu avamine ebaõnnestus."
				throw new Error("Laulu avamine ebaõnnestus.")
			} else {
				return response.text()
			}
		})
		.then(text => {
			showLyrics(text)
		})
	}
	

	var song;
	function showLyrics(text){
		laul = text.split("\n")

		lõiguPealkiri = "";
		lõik = "";
		for (i of laul){
			if (i==""){continue}
			if (i.startsWith("[")){

				if (lõiguPealkiri != ""){
					var sisu = document.createElement("div");
					if (lõiguPealkiri.startsWith("Refrään")){
						sisu.classList.add("verse")
						sisu.classList.add("chorus")
					} else {
						sisu.classList.add("verse")
					}
					sisu.innerHTML = "<span class='vnum'>" + lõiguPealkiri + "</span><p>" + lõik + "</p>"
					document.getElementById("lyrics").appendChild(sisu);
				}

				lõiguPealkiri = i.substring(1, i.length-1)
				lõik = "";
				continue;
			}
			lõik += i+"\n";
		}

		var sisu = document.createElement("div");
		if (lõiguPealkiri.startsWith("Refrään")){
			sisu.classList.add("verse")
			sisu.classList.add("chorus")
		} else {
			sisu.classList.add("verse")
		}
		sisu.innerHTML = "<span class='vnum'>" + lõiguPealkiri + "</span><p>" + lõik + "</p>"
		document.getElementById("lyrics").appendChild(sisu);
	}


	function tagasi(){
		if (document.referrer.includes("search.html")){
			console.log(document.referrer)
			history.back()
			if (!window.location.href.includes("search.html")){
				window.open(document.referrer,"_self")
			}
		} else {
			window.open("/search.html","_self")
		}
	}


	(function () {
    var lyrics = document.getElementById('lyrics');
    var STEP = 2, MIN = 15, MAX = 29;
    var size = parseInt(localStorage.getItem('vl-lyrics-size'), 10) || 19;

    function apply() {
      size = Math.max(MIN, Math.min(MAX, size));
      lyrics.style.setProperty('--lyrics-size', size + 'px');
      localStorage.setItem('vl-lyrics-size', size);
    }
    apply();
    document.getElementById('size-up').addEventListener('click', function () { size += STEP; apply(); });
    document.getElementById('size-down').addEventListener('click', function () { size -= STEP; apply(); });
  })();
