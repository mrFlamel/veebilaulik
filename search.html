<script>
var currentPage = 1;
if (!findGetParameter("lk")){
	changeValueByClassName("otsinguLahter", "value", "1")
} else {
	changeValueByClassName("otsinguLahter", "value", findGetParameter("lk"))
	currentPage = parseInt(findGetParameter("lk"));
}

function muudaNumbrit(value){
	if (value.length > 1){
		changeValueByClassName("otsinguLahter", "value", value.slice(0,1))
	}
}
var lkTulemusteArv = 10;
function vahetaLk(value){
	if (value < 1 || isNaN(value)){
		if (!findGetParameter("lk")){
			changeValueByClassName("otsinguLahter", "value", "1")
		} else {
			changeValueByClassName("otsinguLahter", "value", findGetParameter("lk"))
		}
		return
	}
	changeGetParameter("lk", value);
	currentPage = value;
	changeValueByClassName("otsinguLahter", "value", currentPage)
	otsi()
}
function nextNr(){
	vahetaLk(parseInt(document.getElementsByClassName("otsinguLahter")[0].value)+1);
}
function prevNr(){
	vahetaLk(parseInt(document.getElementsByClassName("otsinguLahter")[0].value)-1);
}
function lastNr(){
	vahetaLk(parseInt(document.getElementsByClassName("otsinguNupp")[2].innerText.substring(1)));
}


var currentTag = "";
if (!findGetParameter("tag")){
	changeGetParameter("tag", "kõik");
	currentTag = "kõik";
} else {
	for (i of document.getElementsByClassName("tag")){
		if (i.classList.contains("is-active")){
			i.classList.remove("is-active")
		}
	}
	document.getElementById(findGetParameter("tag")).classList.add("is-active")
	currentTag = findGetParameter("tag");
}
function uusTag(id){
	for (i of document.getElementsByClassName("tag")){
		if (i.classList.contains("is-active")){
			i.classList.remove("is-active")
		}
	}
	document.getElementById(id).classList.add("is-active");
	changeGetParameter("tag", id);
	currentTag = id;
	vahetaLk(1);
}




document.getElementById("search-input").value = (findGetParameter("searchTerm") ?? "").replace(/\+/g, '%20');
/*OTSIMINE TOIMUB SIIN*/
var globalSongIndex = []
getSongIndex().then(songIndex => {
	globalSongIndex = songIndex;
	otsi()
})


function otsi(){
	var results = [];
	const toSearch = document.getElementById("search-input").value.toLowerCase().replace(/\+/g, '%20')
	changeGetParameter("searchTerm", toSearch);
	
	var tagSortedList = [];
	if (currentTag == "kõik"){
		tagSortedList = globalSongIndex;
	} else {
		tagSortedList = globalSongIndex.filter(obj => obj.teemad.split("/").includes(currentTag))
	}

	for(var i=0; i<tagSortedList.length; i++) {
	  for(key in tagSortedList[i]) {
		if (key=="teemad"){continue} // Teemad sorditi juba eelnevalt ära...
		if (toSearch.endsWith("*")){ // PEALKIRJA ALGUSE JÄRGI OTSING
			if(tagSortedList[i]["pealkiri"].toLowerCase().startsWith(toSearch.slice(0,-1))) {
				if (results.some(e => e.fail === tagSortedList[i].fail)){} else {
					results.push(tagSortedList[i]);
				}
			}
		} else { // TAVAOTSING
			if(tagSortedList[i][key].toLowerCase().indexOf(toSearch)!=-1) {
				if (results.some(e => e.fail === tagSortedList[i].fail)){} else {
					results.push(tagSortedList[i]);
				}
			}
		}
	  }
	}

	if(results.length > 0){
		document.getElementById("otsinguTulemus").innerHTML = "";
		results.sort(function(a, b) {return (a.pealkiri < b.pealkiri) ? -1 : (a.pealkiri > b.pealkiri) ? 1 : 0;}); // Sorteeri tulemus tähestikulises järjekorras
	} else {
		document.getElementById("otsinguTulemus").innerHTML = "Ei õnnestunud ühtegi vastet leida.";
	}
	
	var lkArv = "/1";
	if (results.length > 0){
		lkArv = "/" + findNextMultiplier(results.length, lkTulemusteArv)/lkTulemusteArv;
	}
	document.getElementsByClassName("otsinguNupp")[2].innerText = lkArv;
	document.getElementsByClassName("otsinguNupp")[7].innerText = lkArv;

	if (results.length > (currentPage-1) * lkTulemusteArv){

		algus = (currentPage-1) * lkTulemusteArv;

		if(algus+lkTulemusteArv > results.length){
			for (let i=algus; i<results.length; i++){
				looOtsitavaPakkumine(i, results);
			}
		} else {
			for (let i=algus; i<(lkTulemusteArv+algus); i++){
				looOtsitavaPakkumine(i, results);
			}
		}
	}

}

function looOtsitavaPakkumine(looNumber, songIndex){
	var container = document.createElement("a");
	container.classList.add("otsinguPakkumine");
	//container.onclick = function(){window.open("laulud/" + songIndex[looNumber].fail + ".html", "_self")};
	container.href = "laulud/" + songIndex[looNumber].fail + ".html";
	container.style = "text-decoration-line:none;"
	var pealkiri = ""
	//if (songIndex[looNumber].orgpealkiri){
	//	pealkiri = songIndex[looNumber].pealkiri + " / " + songIndex[looNumber].orgpealkiri + " - " + songIndex[looNumber].viisi_autor
	//} else {
	//	pealkiri = songIndex[looNumber].pealkiri + " - " + songIndex[looNumber].viisi_autor
	//}
	pealkiri = songIndex[looNumber].pealkiri;
	container.innerHTML = '<h2 class="otsitavaPealkiri">' + pealkiri +'</h2><a class="otsitavaId">'+ songIndex[looNumber].id +'</a>'
	document.getElementById("otsinguTulemus").appendChild(container);
}

</script>
